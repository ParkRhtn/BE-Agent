# push·PR 마다 린트·타입 검사·테스트. 테스트는 fake 모델·임시 DB 를 써서 외부 키가 필요 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked

      - name: 린트 (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: 타입 검사 (pyright)
        run: uv run pyright

      - name: 테스트 (pytest)
        run: uv run pytest -q
